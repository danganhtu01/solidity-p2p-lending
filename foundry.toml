[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Invariant/fuzz settings — kept modest so CI stays fast; raise locally for deeper runs.
[invariant]
runs = 64
depth = 256
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4

# Network RPCs — values come from .env (see .env.example). Use: forge script ... --rpc-url sepolia
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
hoodi = "${HOODI_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# Contract verification (Etherscan v2 unified key works across these chains)
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
